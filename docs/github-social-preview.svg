<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Mini-Link social preview</title>
  <desc id="desc">Mini-Link is a blazing-fast LittleLink alternative written in Go.</desc>
  <defs>
